<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<style>
  :root {
    --fondo: #f6f7f9; --papel: #fff; --texto: #1b1d21; --tenue: #6b7280; --borde: #e3e6ea;
    --acento: #2456c9; --ambar: #d1782e; --verde: #1f9d61; --rojo: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #15171b; --papel: #1d2026; --texto: #e8eaed; --tenue: #9aa1ab; --borde: #2c3038; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px 20px 0; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .contadores { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .cont { background: var(--papel); border: 1px solid var(--borde); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .cont.on { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento) inset; }
  .cont b { display: block; font-size: 20px; }
  .cont span { color: var(--tenue); font-size: 12px; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 0 20px 14px; }
  input, select, textarea, button { font: inherit; color: inherit; background: var(--papel);
    border: 1px solid var(--borde); border-radius: 8px; padding: 6px 9px; }
  input[type=search] { min-width: 260px; }
  button { cursor: pointer; }
  button.primario { background: var(--acento); color: #fff; border-color: transparent; }
  main { padding: 0 20px 40px; }
  .dia { margin: 18px 0 6px; color: var(--tenue); font-weight: 600; letter-spacing: .02em; }
  table { width: 100%; border-collapse: collapse; background: var(--papel); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  th { color: var(--tenue); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  tr.fila { cursor: pointer; }
  tr.fila:hover td { background: color-mix(in srgb, var(--acento) 7%, transparent); }
  .pastilla { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap;
    border: 1px solid var(--borde); }
  .e0 { color: var(--acento); border-color: currentColor; }
  .e1 { color: var(--ambar); border-color: currentColor; }
  .e2 { color: var(--tenue); }
  .e3 { color: var(--verde); border-color: currentColor; }
  .hijo td:first-child { padding-left: 26px; }
  .parecido { color: var(--tenue); font-size: 12px; }
  dialog { border: 1px solid var(--borde); border-radius: 12px; background: var(--papel); color: var(--texto);
    max-width: 760px; width: calc(100% - 32px); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .cab { padding: 14px 18px; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .cuerpo { padding: 14px 18px; }
  .literal { background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px;
    white-space: pre-wrap; margin: 8px 0 14px; }
  .campo { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin-bottom: 4px; }
  .campo b { color: var(--tenue); font-weight: 600; }
  .notas li { margin-bottom: 6px; }
  .acciones { padding: 12px 18px; border-top: 1px solid var(--borde); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .aviso { color: var(--rojo); }
  .vacio { color: var(--tenue); padding: 24px; text-align: center; }
  code { background: var(--fondo); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<header>
  <h1>Lo que ha pedido, y en qué quedó</h1>
  <div class="contadores" id="contadores"></div>
</header>

<div class="filtros">
  <input type="search" id="q" placeholder="Buscar por palabras…" autocomplete="off">
  <label>desde <input type="date" id="desde"></label>
  <label>hasta <input type="date" id="hasta"></label>
  <select id="hizo">
    <option value="">lo hizo Claude: todo</option>
  </select>
  <button id="limpiar">Limpiar</button>
</div>

<main id="lista"></main>

<dialog id="detalle"><form method="dialog" id="formDetalle"></form></dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// El día, en la zona del negocio. `slice(0,10)` sobre un ISO es UTC, y a las 7 de la tarde en Texas
// UTC ya está en mañana: la primera captura de esta página fechó una nota de hoy en el día
// siguiente. La zona la manda el servidor para que las dos mitades no puedan discrepar.
const diaLocal = (iso) => {
  if (!iso) return "";
  try {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: DATOS.zona ?? "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit",
    }).format(new Date(iso));
  } catch { return String(iso).slice(0, 10); }
};

let DATOS = { tareas: [], estados: [], hecho: [], estadoFinal: "Completado" };
let filtroEstado = "";
let parecidos = null;   // Map id -> {puntos, comunes} cuando hay busqueda

async function carga() {
  const r = await fetch("/api/tareas");
  DATOS = await r.json();
  const sel = $("#hizo");
  if (sel.options.length === 1) for (const h of DATOS.hecho) sel.add(new Option("lo hizo Claude: " + h, h));
  pinta();
}

function claseEstado(e) { return "e" + Math.max(0, DATOS.estados.indexOf(e)); }

function pintaContadores(visibles) {
  const cont = $("#contadores");
  cont.innerHTML = "";
  const hacer = (etiqueta, n, valor) => {
    const d = document.createElement("div");
    d.className = "cont" + (filtroEstado === valor ? " on" : "");
    d.innerHTML = "<b>" + n + "</b><span>" + esc(etiqueta) + "</span>";
    d.onclick = () => { filtroEstado = filtroEstado === valor ? "" : valor; pinta(); };
    cont.append(d);
  };
  hacer("todas", DATOS.tareas.length, "");
  for (const e of DATOS.estados) hacer(e, DATOS.tareas.filter((t) => t.estado === e).length, e);
}

function filtra() {
  const desde = $("#desde").value, hasta = $("#hasta").value, hizo = $("#hizo").value;
  return DATOS.tareas.filter((t) => {
    if (filtroEstado && t.estado !== filtroEstado) return false;
    if (desde && t.fecha < desde) return false;
    if (hasta && t.fecha > hasta) return false;
    if (hizo && t.lo_hizo_claude !== hizo) return false;
    if (parecidos && !parecidos.has(t.id)) return false;
    return true;
  });
}

function pinta() {
  pintaContadores();
  let l = filtra();
  if (parecidos) l = l.sort((a, b) => parecidos.get(b.id).puntos - parecidos.get(a.id).puntos);
  const main = $("#lista");
  main.innerHTML = "";
  if (!l.length) { main.innerHTML = '<div class="vacio">Nada con esos filtros.</div>'; return; }

  // Por fecha, de lo mas reciente a lo mas viejo. Con una busqueda activa se deja el orden por
  // parecido, que es lo que se ha pedido mirar.
  const grupos = new Map();
  for (const t of l) {
    const clave = parecidos ? "Por parecido" : t.fecha;
    if (!grupos.has(clave)) grupos.set(clave, []);
    grupos.get(clave).push(t);
  }
  const claves = parecidos ? [...grupos.keys()] : [...grupos.keys()].sort().reverse();

  for (const clave of claves) {
    const h = document.createElement("div");
    h.className = "dia";
    h.textContent = clave + "  ·  " + grupos.get(clave).length;
    main.append(h);
    const tabla = document.createElement("table");
    tabla.innerHTML = "<thead><tr><th style='width:115px'>ID</th><th style='width:90px'>Claude</th>"
      + "<th style='width:200px'>Estado</th><th>Qué pidió</th></tr></thead>";
    const tb = document.createElement("tbody");
    for (const t of grupos.get(clave)) {
      const tr = document.createElement("tr");
      tr.className = "fila" + (t.padre ? " hijo" : "");
      const p = parecidos?.get(t.id);
      tr.innerHTML = "<td style='white-space:nowrap'>" + esc(t.id)
        + (t.padre ? "<br><span class='parecido'>de " + esc(t.padre) + "</span>" : "") + "</td>"
        + "<td>" + esc(t.lo_hizo_claude) + "</td>"
        + "<td><span class='pastilla " + claseEstado(t.estado) + "'>" + esc(t.estado) + "</span></td>"
        + "<td>" + esc(t.resumen)
        + (p ? "<div class='parecido'>parecido " + Math.round(p.puntos * 100) + "% · por: " + esc(p.comunes.join(", ")) + "</div>" : "")
        + "</td>";
      tr.onclick = () => abre(t.id);
      tb.append(tr);
    }
    tabla.append(tb);
    main.append(tabla);
  }
}

function abre(id) {
  const t = DATOS.tareas.find((x) => x.id === id);
  if (!t) return;
  const ev = t.evidencia ?? {};
  const hijas = DATOS.tareas.filter((x) => x.padre === t.id);
  const filaEv = (k, v) => (v?.length ? "<div class='campo'><b>" + esc(k) + "</b><span>" + v.map(esc).join(", ") + "</span></div>" : "");

  $("#formDetalle").innerHTML =
    "<div class='cab'><b>" + esc(t.id) + " · " + esc(t.fecha) + "</b>"
    + "<span class='pastilla " + claseEstado(t.estado) + "'>" + esc(t.estado) + "</span></div>"
    + "<div class='cuerpo'>"
    + "<p>" + esc(t.resumen) + "</p>"
    + (t.texto_original ? "<b class='parecido'>Lo que pidió, literal</b><div class='literal'>" + esc(t.texto_original) + "</div>" : "")
    + "<div class='campo'><b>lo hizo Claude</b><span>" + esc(t.lo_hizo_claude) + "</span></div>"
    + (t.padre ? "<div class='campo'><b>subtarea de</b><span>" + esc(t.padre) + "</span></div>" : "")
    + (hijas.length ? "<div class='campo'><b>subtareas</b><span>" + hijas.map((x) => esc(x.id)).join(", ") + "</span></div>" : "")
    + filaEv("commits", ev.commits) + filaEv("PRs", ev.prs) + filaEv("ficheros", ev.ficheros)
    + filaEv("decisiones", ev.decisiones) + filaEv("links", ev.links) + filaEv("de dónde salió", t.fuentes)
    + (t.notas?.length ? "<b class='parecido'>Notas</b><ul class='notas'>"
        + t.notas.map((n) => "<li>[" + esc(diaLocal(n.fecha)) + "] " + esc(n.texto) + "</li>").join("") + "</ul>" : "")
    + "</div>"
    + "<div class='acciones'>"
    + "<select id='nuevoEstado'>" + DATOS.estados.map((e) => "<option" + (e === t.estado ? " selected" : "") + ">" + esc(e) + "</option>").join("") + "</select>"
    + "<input id='nuevaNota' placeholder='Añadir una nota…' style='flex:1;min-width:180px'>"
    + "<label><input type='checkbox' id='confirmado'> lo confirmó el dueño</label>"
    + "<button type='button' class='primario' id='guardar'>Guardar</button>"
    + "<button value='cerrar'>Cerrar</button>"
    + "<span id='error' class='aviso'></span>"
    + "</div>";

  $("#guardar").onclick = async () => {
    const cuerpo = {
      estado: $("#nuevoEstado").value,
      nota: $("#nuevaNota").value,
      confirmadoPorElDueno: $("#confirmado").checked,
    };
    const r = await fetch("/api/tarea/" + encodeURIComponent(t.id), {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(cuerpo),
    });
    const d = await r.json();
    if (!r.ok) { $("#error").textContent = d.error ?? "no se pudo guardar"; return; }
    $("#detalle").close();
    await carga();
  };
  $("#detalle").showModal();
}

let t_busca;
$("#q").oninput = () => {
  clearTimeout(t_busca);
  t_busca = setTimeout(async () => {
    const q = $("#q").value.trim();
    if (!q) { parecidos = null; pinta(); return; }
    const r = await fetch("/api/buscar?q=" + encodeURIComponent(q) + "&limite=30");
    const d = await r.json();
    parecidos = new Map(d.resultados.map((x) => [x.id, x]));
    pinta();
  }, 150);
};
for (const id of ["#desde", "#hasta", "#hizo"]) $(id).onchange = pinta;
$("#limpiar").onclick = () => {
  $("#q").value = ""; $("#desde").value = ""; $("#hasta").value = ""; $("#hizo").value = "";
  filtroEstado = ""; parecidos = null; pinta();
};

carga();
</script>
</body>
</html>
