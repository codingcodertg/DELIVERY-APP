apply plugin: 'com.android.application'

// Firebase (push) is applied ONLY when google-services.json is present.
// Applying it without the file fails the build outright, so a checkout that
// hasn't been given the Firebase config still compiles — it just can't push.
def firebaseConfig = file('google-services.json')
if (firebaseConfig.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("google-services.json not found - building WITHOUT push notifications.")
}

// Release signing. The keystore path + passwords live in keystore.properties,
// which is NEVER committed (see .gitignore) — each machine that builds a
// release keeps its own copy. Without that file the release build falls back
// to debug signing, so a checkout still builds instead of failing on a
// credential it can't have.
//
// versionCode is what the in-app updater compares. Bump it on every release
// that drivers should be prompted to install.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "net.rdztilegroup.deliveries"
    compileSdk rootProject.ext.compileSdkVersion

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "net.rdztilegroup.deliveries"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        // Cosmetic only (Android's app-info screen). Kept roughly in step with
        // APP_VERSION so a phone's settings page doesn't claim an ancient build.
        versionName "1.10.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("keystore.properties not found — release APK will be debug-signed and CANNOT update an existing install.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Time-based position reporting (BatteryGuardPlugin). The GPS plugin pulls
    // this in too, but with `implementation`, so it isn't visible here — the
    // app module has to ask for it by name. Same version, deliberately: two
    // copies of Play Services location in one build is a merge conflict
    // waiting to happen.
    implementation "com.google.android.gms:play-services-location:21.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
