<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RTG Hub</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      background: #0f1b33; color: #fff; text-align: center; padding: 24px;
    }
    .box { max-width: 320px; }
    .logo {
      width: 74px; height: 74px; margin: 0 auto 18px; border-radius: 18px;
      background: #2456c9; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 26px; letter-spacing: 1px;
    }
    h1 { font-size: 19px; margin: 0 0 8px; }
    p { font-size: 14.5px; line-height: 1.55; opacity: .82; margin: 0; }
  </style>
</head>
<body>
  <!-- Shown only when the phone can't reach the site. The shell normally
       loads the live app straight from the server. -->
  <div class="box">
    <div class="logo">RDZ</div>
    <h1>Sin conexión</h1>
    <p>No se pudo conectar con el sistema. Revisa tu señal o Wi-Fi — la app se abrirá sola cuando vuelva la conexión.</p>
  </div>
</body>
</html>
