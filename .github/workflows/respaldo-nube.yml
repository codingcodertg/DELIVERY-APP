# Respaldo de la base en la nube (D-1206, auditoría 2026-11-27). El de la laptop solo corre si está prendida y con la
# sesión abierta (el 26 nov quedó a medias). Este corre en GitHub cada noche, aunque la laptop esté apagada.
#
# Qué hace: pg_dump de TODA la base (formato custom), lo cifra con AES-256 (gpg, contraseña en el secreto
# BACKUP_PASSPHRASE) y lo guarda como artefacto del workflow 90 días. Sin la contraseña el archivo no sirve: aunque
# alguien con acceso al repo lo baje, no puede leerlo. La contraseña también está guardada en la laptop
# (RESPALDOS-DB\CLAVE-RESPALDO-NUBE.txt).
#
# Si falla, GitHub manda correo al dueño del repo (aviso de workflow fallido). Solo LEE la base.
#
# Restaurar: bajar el artefacto, `gpg --decrypt base-AAAA-MM-DD.dump.gpg > base.dump`, y pg_restore en una base de
# PRUEBA (ver RESPALDOS-DB\LEEME.txt).
#
# Secretos: BACKUP_DB_URL (la URL del pooler de sesión, la misma SUPABASE_DB_URL de .env.local) y BACKUP_PASSPHRASE.

name: respaldo-nube

on:
  schedule:
    - cron: "15 8 * * *" # 2:15 am de Chicago (CST)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: respaldo-nube
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Respaldo cifrado
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_DB_URL" || { echo "Falta el secreto BACKUP_DB_URL"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "Falta el secreto BACKUP_PASSPHRASE"; exit 1; }
          HOY=$(TZ=America/Chicago date +%F)
          echo "HOY=$HOY" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges --dbname "$BACKUP_DB_URL" --file base.dump
          SIZE=$(stat -c %s base.dump)
          test "$SIZE" -gt 10000000 || { echo "El respaldo salió muy chico ($SIZE bytes)"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
              --output "base-$HOY.dump.gpg" base.dump 3<<< "$BACKUP_PASSPHRASE"
          rm -f base.dump
          echo "Respaldo: $((SIZE / 1048576)) MB sin cifrar"

      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ env.HOY }}
          path: base-${{ env.HOY }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
