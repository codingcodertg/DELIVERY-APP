# Lector de Indeed por correo (D-1051): revisa el buzon de Outlook conectado cada 15 minutos.
#
# POR QUE AQUI Y NO EN vercel.json: igual que tt-cron.yml, Vercel Hobby solo admite crons diarios.
# Usa el mismo secreto TT_CRON_SECRET (= CRON_SECRET de Vercel); nunca se escribe aqui ni sale en los logs.
# La ruta contesta 200 tambien cuando no hay buzon conectado, asi que no falla antes de conectar.

name: outlook-indeed-cron

on:
  # D-1072: el horario ahora lo lleva Supabase (pg_cron, migración 319). Aquí queda solo el disparo manual.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: outlook-indeed-cron
  cancel-in-progress: false

env:
  BASE_URL: https://rtg-hub.vercel.app
  CRON_PATH: /api/cron/outlook-indeed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run cron
        env:
          SECRET: ${{ secrets.TT_CRON_SECRET }}
        run: |
          set -euo pipefail
          q=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then q="?verify=1"; fi
          code=$(curl -sS -m 150 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SECRET}" \
            "${BASE_URL}${CRON_PATH}${q}")
          echo "cron -> HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::el cron devolvio ${code} (se esperaba 200)"
            exit 1
          fi

      # Gmail: mismo horario y mismo secreto. `always()` hace que corra aunque falle el de Outlook; sin Gmail conectado la
      # ruta contesta 200 enseguida.
      - name: Run Gmail cron
        if: ${{ always() }}
        env:
          SECRET: ${{ secrets.TT_CRON_SECRET }}
        run: |
          set -euo pipefail
          q=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then q="?verify=1"; fi
          code=$(curl -sS -m 150 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SECRET}" \
            "${BASE_URL}/api/cron/gmail-indeed${q}")
          echo "gmail cron -> HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::el cron de Gmail devolvio ${code} (se esperaba 200)"
            exit 1
          fi
